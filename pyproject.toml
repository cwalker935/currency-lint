[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "currencylint"
version = "0.1.0"
description = "A line-oriented linter for currency amount formatting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "cwalker935"}]

[project.scripts]
currencylint = "currencylint.cli:main"

[tool.setuptools.packages.find]
include = ["currencylint*"]
